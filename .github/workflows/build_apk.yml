name: Build Release APK and Play Store Bundle (AAB)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Build Release APK
        run: |
          cd flutter_app
          flutter build apk --release

      - name: Build Google Play App Bundle (AAB)
        run: |
          cd flutter_app
          flutter build appbundle --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: GasExpress-Release-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Play Store App Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: GasExpress-PlayStore-AAB
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab
