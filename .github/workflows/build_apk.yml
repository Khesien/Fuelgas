name: Build Release APK and Play Store Bundle (AAB)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout source ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Java 17 (required for Android build tools) ────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 3. Set up Flutter ────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ── 4. Get Flutter dependencies ──────────────────────────────────────────
      - name: Get Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      # ── 5. Decode keystore from GitHub Secrets ───────────────────────────────
      #    (Only runs when KEYSTORE_BASE64 secret is set)
      - name: Decode release keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        working-directory: flutter_app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks

      - name: Write key.properties
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        working-directory: flutter_app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          cat > key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF

      # ── 6. Analyze code (non-fatal) ──────────────────────────────────────────
      - name: Analyze Flutter code
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos || true

      # ── 7. Build Google Play Store App Bundle (.aab) ─────────────────────────
      - name: Build App Bundle (AAB) for Play Store
        working-directory: flutter_app
        run: flutter build appbundle --release
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # ── 8. Build Release APK (.apk) ──────────────────────────────────────────
      - name: Build Release APK
        working-directory: flutter_app
        run: flutter build apk --release --split-per-abi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # ── 9. Upload Play Store AAB as artifact ─────────────────────────────────
      - name: Upload GasExpress Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: GasExpress-PlayStore-AAB
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      # ── 10. Upload Release APKs as artifacts ─────────────────────────────────
      - name: Upload GasExpress Release APK
        uses: actions/upload-artifact@v4
        with:
          name: GasExpress-Release-APK
          path: flutter_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
